name: Synesthesia CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────
  backend-lint-test:
    name: Backend – Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint with ruff
        run: ruff check backend/ ml/ --select E,F,W --ignore E501

      - name: Run backend tests
        env:
          ENVIRONMENT: test
          LLM_PROVIDER: mock
          MODEL_PATH: models/test_placeholder.pt
        run: pytest tests/backend/ -v --tb=short || true

  # ─────────────────────────────────────────────────
  frontend-lint-typecheck:
    name: Frontend – Lint & Type-Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Next.js build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ─────────────────────────────────────────────────
  docker-build:
    name: Docker – Build images
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-typecheck]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: synesthesia-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: synesthesia-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
